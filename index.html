<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Le Bouchon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Impact", "Arial Black", sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: strobeBg 150ms steps(2, end) infinite;
  }

  .text {
    font-size: clamp(3rem, 12vw, 12rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1;
    text-transform: uppercase;
    animation: strobeText 150ms steps(2, end) infinite;
    user-select: none;
  }

  @keyframes strobeBg {
    0%   { background: #000; }
    50%  { background: #fff; }
    100% { background: #000; }
  }

  @keyframes strobeText {
    0%   { color: #fff; opacity: 1; }
    49%  { color: #fff; opacity: 1; }
    50%  { color: #000; opacity: 1; }
    100% { color: #000; opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .text {
      animation: none;
    }
    .stage { background: #000; }
    .text { color: #fff; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="text">Le Bouchon<br>August 10</div>
  </div>
</body>
</html>
