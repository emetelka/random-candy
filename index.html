<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Candy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Impact", "Arial Black", sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    animation: strobe 700ms step-end infinite;
  }

  .text {
    font-size: clamp(3rem, 12vw, 12rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    user-select: none;
  }

  @keyframes strobe {
    0%   { filter: none; }
    80%  { filter: none; }
    80.001% { filter: invert(1); }
    100% { filter: invert(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage {
      animation: none;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="text">Le Bouchon<br>(Or Rootstock)<br>August 10</div>
  </div>
</body>
</html>
